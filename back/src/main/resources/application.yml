spring:
  #数据库连接信息
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/batnew}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  #Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  #阿里云OSS配置
  alioss:
    endpoint: oss-cn-beijing.aliyuncs.com
    access-key-id: ${ALIOSS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIOSS_ACCESS_KEY_SECRET:}
    bucket-name: bat-manager

jwt:
  secret: ${JWT_SECRET:}
  expiration-millis: ${JWT_EXPIRATION_MILLIS:604800000}

ai:
  adapter-url: ${AI_ADAPTER_URL:http://127.0.0.1:8091}
  internal-token: ${AI_INTERNAL_TOKEN:}
  context-secret: ${AI_CONTEXT_SECRET:}
  adapter-connect-timeout-ms: ${AI_ADAPTER_CONNECT_TIMEOUT_MS:3000}
  adapter-read-timeout-ms: ${AI_ADAPTER_READ_TIMEOUT_MS:120000}
  max-concurrent-requests: ${AI_MAX_CONCURRENT_REQUESTS:64}
  concurrency-lease-seconds: ${AI_CONCURRENCY_LEASE_SECONDS:60}

#Mybatis配置
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true # 驼峰命名
  mapper-locations: classpath*:Mapper/*.xml
